name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Filkollen.xcodeproj -scheme Filkollen -configuration Debug CODE_SIGNING_ALLOWED=NO build
